<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script>
(function () {
    const theme = localStorage.getItem('theme') || 'dark';

    if (theme === 'light') {
        document.documentElement.classList.add('light-theme'); // روی html
        document.body.classList.add('light-theme');            // روی body
    } else {
        document.body.classList.remove('light-theme');        // حذف کلاس در حالت dark
    }
})();
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/all.css">
    <link rel="stylesheet" href="../style.css">
    <title>تولید پسورد</title>
    <style>
        
    </style>
</head>
<body>

    <div class="container">
        <div class="grid">
            <!-- ستون گزینه‌ها -->
            <div class="card">
                <label class="switch-container">
                    <input type="checkbox" id="uppercase">
                    <span class="slider"></span>
                    <span>استفاده از حروف بزرگ(ABC)</span>
                </label>

                <label class="switch-container">
                    <input type="checkbox" id="lowercase">
                    <span class="slider"></span>
                    <span>استفاده از حروف کوچک(abc)</span>
                </label>

                <label class="switch-container">
                    <input type="checkbox" id="numbers">
                    <span class="slider"></span>
                    <span>استفاده از اعداد(123)</span>
                </label>

                <label class="switch-container">
                    <input type="checkbox" id="symbols">
                    <span class="slider"></span>
                    <span>استفاده از علامت‌ها (@#$...)</span>
                </label>

                <label class="switch-container">
                    <input type="checkbox" id="maxSecure" checked>
                    <span class="slider"></span>
                    <span>امن‌ترین حالت</span>
                </label>

                <label>طول پسورد:</label>
                <div class="length-controls">
                    <button class="btn adjust" id="increase">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <input type="number" id="length" min="4" max="100" value="8">
                    <button class="btn adjust" id="decrease">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                </div>
            </div>

            <!-- ستون طول پسورد و ساختن -->
            <div class="card">
                <div class="password-box">
                    <input type="text" id="password" placeholder="پسورد شما اینجا نمایش داده میشود">
                </div>
            </div>

            <!-- ستون دکمه‌ها -->
            <div class="card btn-column">
                <button class="btn primary w-100" id="generateBtn">
                    <i class="fa-solid fa-key"></i>
                    ساختن
                </button>

                <button class="btn success w-100" id="copyBtn">
                    <i class="fa-solid fa-copy"></i>
                    کپی
                </button>

                <button class="btn w-100" id="saveBtn">
                    <i class="fa-solid fa-database"></i>
                    ذخیره کردن
                </button>
                <a style="text-decoration: none;" href="../index.html">
                    <button class="btn success"><i class="fa-solid fa-home"></i>خانه</button>
                    </a>

            </div>
        </div>
    </div>

    <!-- Popup پیام کپی -->
    <div id="copyPopup" class="popup">کپی شد!</div>

    <script>
        // منتظر بارگذاری کامل صفحه می‌مانیم
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const saveBtn = document.getElementById('saveBtn');
            const passwordInput = document.getElementById('password');
            const lengthInput = document.getElementById('length');
            const uppercaseCheckbox = document.getElementById('uppercase');
            const lowercaseCheckbox = document.getElementById('lowercase');
            const numbersCheckbox = document.getElementById('numbers');
            const symbolsCheckbox = document.getElementById('symbols');

            const UPPERCASE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const LOWERCASE = "abcdefghijklmnopqrstuvwxyz";
            const NUMBERS = "0123456789";
            const SYMBOLS = "@#$%^&*!?";

            // تولید پسورد
            function generatePassword() {
                let charset = "";
                if (uppercaseCheckbox.checked) charset += UPPERCASE;
                if (lowercaseCheckbox.checked) charset += LOWERCASE;
                if (numbersCheckbox.checked) charset += NUMBERS;
                if (symbolsCheckbox.checked) charset += SYMBOLS;

                if (!charset) {
                    showPopup("حداقل باید یکی از گزینه‌ها روشن باشد");
                    return ""; // اگر هیچ گزینه‌ای انتخاب نشده باشد، پسورد تولید نشود
                }

                let length = parseInt(lengthInput.value);
                let password = "";
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * charset.length);
                    password += charset[randomIndex];
                }
                return password;
            }

            // رویدادها
            generateBtn.addEventListener('click', () => {
                const pwd = generatePassword();
                passwordInput.value = pwd;
            });

            // ذخیره در localStorage و رفتن به صفحه saved.html
// ذخیره پسورد در localStorage و رفتن به صفحه saved.html
    saveBtn.addEventListener('click', () => {
        const password = passwordInput.value;

        if (!password) {
            console.log("پسوردی وارد نشده است!");
            return;
        }

        // ذخیره پسورد در localStorage
        localStorage.setItem('temp_pass', password);

        // ذخیره پرچم برای نشان دادن پاپ‌آپ در صفحه بعد
        localStorage.setItem('fromPasswordPage', 'true');

        // انتقال به صفحه بعدی
        window.location.href = "savemenu.html";
    });

            const increaseBtn = document.getElementById('increase');
            const decreaseBtn = document.getElementById('decrease');

            increaseBtn.addEventListener('click', () => {
                let val = parseInt(lengthInput.value);
                if (val < parseInt(lengthInput.max)) lengthInput.value = val + 1;
            });

            decreaseBtn.addEventListener('click', () => {
                let val = parseInt(lengthInput.value);
                if (val > parseInt(lengthInput.min)) lengthInput.value = val - 1;
            });

            // متغیرهای مربوط به چک‌باکس‌ها
            const maxSecure = document.getElementById('maxSecure');
            const uppercase = document.getElementById('uppercase');
            const lowercase = document.getElementById('lowercase');
            const numbers = document.getElementById('numbers');
            const symbols = document.getElementById('symbols');

            // رویداد تغییر وضعیت تیک امن‌ترین حالت
            function handleMaxSecure() {
                if (maxSecure.checked) {
                    // اگر امن‌ترین حالت فعال شد، همه چک‌باکس‌ها فعال می‌شوند
                    uppercase.checked = true;
                    lowercase.checked = true;
                    numbers.checked = true;
                    symbols.checked = true;

                    // تغییر طول پسورد به 12
                    lengthInput.value = 12;
                } else {
                    // اگر تیک برداشته شد، طول پسورد به 8 تغییر می‌کند
                    lengthInput.value = 8;

                    // غیرفعال کردن همه چک‌باکس‌ها
                    uppercase.checked = false;
                    lowercase.checked = false;
                    numbers.checked = false;
                    symbols.checked = false;
                }
            }

            maxSecure.addEventListener('change', handleMaxSecure);

            // برای جلوگیری از تیک خوردن امن‌ترین حالت وقتی که بقیه تیک‌ها برداشته شوند
            const checkboxes = [uppercase, lowercase, numbers, symbols];
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', () => {
                    checkMaxSecureState();
                });
            });

            // تابع برای بررسی اینکه آیا باید تیک امن‌ترین حالت رو برداریم یا نه
            function checkMaxSecureState() {
                if (!uppercase.checked || !lowercase.checked || !numbers.checked || !symbols.checked) {
                    maxSecure.checked = false;
                    document.getElementById('length').value = 8; // طول پسورد به 8 تغییر می‌کند
                }
            }

            // نمایش پاپ‌آپ با پیامی خاص
            function showPopup(message) {
                const popup = document.createElement('div');
                popup.classList.add('popup');
                popup.innerText = message;
                document.body.appendChild(popup);
                setTimeout(() => {
                    popup.classList.add('show');
                }, 10);

                setTimeout(() => {
                    popup.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(popup);
                    }, 500);
                }, 3000);
            }

            // کپی کردن پسورد به کلیپ‌بورد
            const copyPopup = document.getElementById('copyPopup');

            copyBtn.addEventListener('click', () => {
                if (!passwordInput.value) return;

                navigator.clipboard.writeText(passwordInput.value)
                    .then(() => {
                        // نمایش پاپ‌آپ
                        copyPopup.classList.add('show');

                        // بعد از 2 ثانیه پاپ‌آپ محو شود
                        setTimeout(() => {
                            copyPopup.classList.remove('show');
                        }, 2000);
                    })
                    .catch(err => console.error(err));
            });

            // فعال کردن "امن‌ترین حالت" به طور پیش‌فرض و تیک زدن همه چک‌باکس‌ها
            window.addEventListener('DOMContentLoaded', () => {
                maxSecure.checked = true; // فعال کردن "امن‌ترین حالت"
                uppercase.checked = true; // فعال کردن چک‌باکس حروف بزرگ
                lowercase.checked = true; // فعال کردن چک‌باکس حروف کوچک
                numbers.checked = true; // فعال کردن چک‌باکس اعداد
                symbols.checked = true; // فعال کردن چک‌باکس علامت‌ها

                // بعد از این که تیک امن‌ترین حالت فعال شد، طول پسورد رو تغییر میدیم
                document.getElementById('length').value = 12;
            });
        });
        
    </script>
</body>
</html>
